<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    :root { color-scheme: light dark; }
    body { width: 280px; margin: 0; padding: 16px; font: 13px -apple-system, sans-serif; }
    h1 { font-size: 14px; margin: 0 0 12px; }
    hr { border: none; border-top: 1px solid rgba(128,128,128,.3); margin: 14px 0; }

    fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
    fieldset:disabled { opacity: .4; }

    .row { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    .toggle { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .toggle.sub { font-weight: normal; margin: 10px 0 0; }

    .line { display: flex; gap: 8px; align-items: center; }
    input[type=range] { flex: 1; }
    input[type=number] { width: 64px; padding: 3px 4px; }
    input[type=color] { width: 40px; height: 28px; padding: 0; border: none; background: none; }
    .rgb { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
    .rgb span { width: 10px; }
    .rgb input { width: 52px; }
    .hint { font-size: 11px; opacity: .6; margin-top: 4px; }
    button { width: 100%; padding: 6px; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Dot Cursor 設定</h1>

  <!-- 入力欄のIDは defaults.js の設定名と同じにしてある -->
  <label class="toggle">
    <input type="checkbox" id="dotCursor">
    メインのカーソルをドットにする
  </label>

  <fieldset id="dotBox">
    <div class="row">
      <label>メインの色</label>
      <div class="line">
        <input type="color" id="color">
        <span class="hint" style="margin:0">パレットから選ぶ</span>
      </div>
      <div class="rgb">
        <span>R</span><input type="number" id="r" min="0" max="255">
        <span>G</span><input type="number" id="g" min="0" max="255">
        <span>B</span><input type="number" id="b" min="0" max="255">
      </div>
    </div>

    <div class="row">
      <label>メインのドットの大きさ (px)</label>
      <div class="line">
        <input type="range" id="mainSize" min="4" max="32" step="1">
        <input type="number" id="mainSizeNum" min="4" max="32" step="1">
      </div>
    </div>
  </fieldset>

  <hr>

  <div class="row">
    <label>追いかけるドットの大きさ (px)</label>
    <div class="line">
      <input type="range" id="size" min="4" max="60" step="1">
      <input type="number" id="sizeNum" min="4" max="60" step="1">
    </div>
  </div>

  <div class="row">
    <label>追いかける速さ</label>
    <div class="line">
      <input type="range" id="speed" min="0.01" max="1" step="0.01">
      <input type="number" id="speedNum" min="0.01" max="1" step="0.01">
    </div>
    <div class="hint">大きいほど速く追いつきます（0.01〜1）</div>
  </div>

  <hr>

  <label class="toggle">
    <input type="checkbox" id="hoverEnabled">
    リンクやボタンの上で大きくする
  </label>

  <fieldset id="hoverBox">
    <div class="row">
      <label>拡大の倍率</label>
      <div class="line">
        <input type="range" id="hoverScale" min="1" max="4" step="0.1">
        <input type="number" id="hoverScaleNum" min="1" max="4" step="0.1">
      </div>
    </div>
    <label class="toggle sub">
      <input type="checkbox" id="hoverInputs">
      テキスト入力欄も対象にする
    </label>
  </fieldset>

  <button id="reset">デフォルトに戻す</button>

  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
